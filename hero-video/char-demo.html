<!doctype html><meta charset="utf-8"><title>코드 캐릭터 동작 시험</title>
<body style="margin:0;background:#111"><canvas id="c" width="1080" height="1080" style="max-width:100%"></canvas>
<script src="parts.js"></script><script src="character.js"></script>
<script>
// 코드로 그린 캐릭터가 포즈를 바꾸며 움직이는 10초 시험 영상
const TOTAL = 10, ctx = document.getElementById("c").getContext("2d");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
function runPose(t) {
  const c = Math.sin(t * 11), d = Math.cos(t * 11);
  return Object.assign({}, POSES.run, {
    lf: [235 + 95 * c, 985 - 40 * Math.max(0, -d)], rf: [395 - 95 * c, 985 - 40 * Math.max(0, d)],
    lh: [120 - 60 * c, 700 + 30 * c], rh: [520 + 60 * c, 700 - 30 * c], lb: 1, rb: -1, lkb: 1, rkb: 1,
  });
}
const KEYS = [   // [시작, 끝, 포즈 함수]
  [0, 2.2, t => Object.assign({}, POSES.spray, { face: { mouth: "open", blink: clamp(1 - Math.abs(t - 1.3) * 12) } })],
  [2.6, 4.2, runPose],
  [4.6, 6.2, t => POSES.flyUp],
  [6.6, 8.1, t => POSES.lift],
  [8.5, 10, t => POSES.cheer],
];
function poseAt(t) {
  for (let i = 0; i < KEYS.length; i++) {
    const [a, b, f] = KEYS[i];
    if (t <= b) {
      if (t >= a || i === 0) return f(t);
      const [pa, pb, pf] = KEYS[i - 1];
      return lerpPose(pf(pb), f(a), ease(seg(t, pb, a)));
    }
  }
  return KEYS[KEYS.length - 1][2](t);
}
function drawAt(t) {
  const g = ctx.createLinearGradient(0, 0, 0, 1080);
  g.addColorStop(0, "#8fd0ff"); g.addColorStop(1, "#e8f6ff"); ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1080);
  ctx.fillStyle = "#9bd27a"; ctx.fillRect(0, 900, 1080, 180);
  let x = 540, y = 770, P = poseAt(t);
  if (t > 2.6 && t < 4.2) y -= Math.abs(Math.sin(t * 11)) * 18;
  const fly = seg(t, 4.4, 5.0) * (1 - seg(t, 6.2, 6.6));
  y -= fly * (120 + Math.sin(t * 4) * 12);
  if (t > 8.5) y -= Math.max(0, Math.sin((t - 8.6) * 5)) * 60;
  if (fly > 0.05) {   // 속도선
    ctx.strokeStyle = `rgba(255,255,255,${0.7 * fly})`; ctx.lineWidth = 6; ctx.lineCap = "round";
    for (let i = 0; i < 14; i++) { const lx = 100 + ((i * 137) % 880), ly = ((i * 211 + t * 1400) % 1300) - 200; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 140); ctx.stroke(); }
  }
  ctx.fillStyle = "rgba(40,80,40,0.25)"; ctx.beginPath(); ctx.ellipse(540, 945, 170 * (1 - fly * 0.4), 26, 0, 0, 7); ctx.fill();
  if (t < 2.3) {   // 소화기 분사
    for (let i = 0; i < 60; i++) {
      const age = (t + i * 0.137) % 0.8, x0 = x + (5 - 315) * 0.62, y0 = y + (712 - 835) * 0.62;
      ctx.fillStyle = `rgba(255,255,255,${0.8 * (1 - age / 0.8)})`;
      ctx.beginPath(); ctx.arc(x0 - age * 520, y0 + age * 60 + Math.sin(i) * age * 90, 8 + age * 50, 0, 7); ctx.fill();
    }
  }
  if (t > 6.4 && t < 8.3) {   // 물방울 모으기
    const r = 40 + 130 * seg(t, 6.6, 8.0), a = 1 - seg(t, 8.1, 8.3);
    const gg = ctx.createRadialGradient(x - r * 0.3, y - 580 - r * 0.3, 5, x, y - 580, r);
    gg.addColorStop(0, `rgba(230,250,255,${a})`); gg.addColorStop(0.5, `rgba(90,190,255,${a})`); gg.addColorStop(1, `rgba(20,100,220,${a})`);
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, y - 580, r, 0, 7); ctx.fill();
  }
  drawChar(ctx, Object.assign({ x, y, s: 0.62 }, P), t);
}
drawAt(0);
if (!window.RENDER) { const t0 = performance.now(); (function loop() { drawAt(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); })(); }
</script>
