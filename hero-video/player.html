<title>소화기 히어로 산불 진화</title>
<style>
/* 한 화면 세로 영상 플레이어: 가운데 9:16 무대, 아래 조작줄 */
@font-face{font-family:"Do Hyeon";src:url(data:font/woff2;base64,__FONT__) format("woff2")}
:root{--bg:#120d14;--surface:#1f1822;--ink:#f4ede6;--muted:#a99aa3;--line:#3a2e38;--accent:#ff7a1a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Do Hyeon",system-ui,sans-serif;padding:12px 16px}
.wrap{max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;align-items:center}
.stage{position:relative;height:calc(100% - 56px);max-height:820px;aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line)}
canvas{width:100%;height:100%;display:block}
.big{position:absolute;inset:0;margin:auto;width:92px;height:92px;border-radius:50%;border:0;background:rgba(255,122,26,.92);color:#fff;font-size:34px;cursor:pointer}
.ctl{width:100%;display:flex;align-items:center;gap:10px}
.btn{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;min-width:64px}
.btn:focus-visible,.big:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
</style>
<div class="wrap">
  <div class="stage"><canvas id="c" width="1080" height="1920"></canvas><button class="big" id="big" aria-label="재생">▶</button></div>
  <div class="ctl" id="ctl">
    <button class="btn" id="play">재생</button>
    <input type="range" id="seek" min="0" max="30" step="0.01" value="0" aria-label="재생 위치">
    <span class="time" id="time">0:00</span>
  </div>
</div>
<audio id="snd" preload="auto" src="__AUDIO__"></audio>
<script>const HERO_SRC="data:image/png;base64,__HERO__";</script>
<script>
__SCENE__
</script>
<script>
(function(){
  if (window.RENDER) { document.getElementById("big").hidden = true; document.getElementById("ctl").hidden = true; return; }
  const snd = document.getElementById("snd"), seek = document.getElementById("seek"), time = document.getElementById("time"),
        btn = document.getElementById("play"), big = document.getElementById("big");
  const hasAudio = snd.getAttribute("src").startsWith("data:");
  let playing = false, t = 3.6, t0 = 0, p0 = 0;
  const fmt = s => `0:${String(Math.floor(s)).padStart(2, "0")}`;
  function show(){ drawAt(t); seek.value = t; time.textContent = fmt(t); }
  function now(){ return hasAudio && !snd.paused ? snd.currentTime : p0 + (performance.now() - t0) / 1000; }
  function loop(){ if (!playing) return; t = now(); if (t >= TOTAL) { t = TOTAL; stop(); } show(); requestAnimationFrame(loop); }
  function start(){ if (t >= TOTAL - 0.05) t = 0; playing = true; p0 = t; t0 = performance.now();
    if (hasAudio) { snd.currentTime = t; snd.play().catch(() => {}); }
    btn.textContent = "멈춤"; big.hidden = true; requestAnimationFrame(loop); }
  function stop(){ playing = false; snd.pause(); btn.textContent = "재생"; big.hidden = false; }
  btn.onclick = big.onclick = () => playing ? stop() : start();
  seek.oninput = () => { t = +seek.value; p0 = t; t0 = performance.now(); if (hasAudio) snd.currentTime = t; show(); };
  hero.onload = show; document.fonts.load('40px "Do Hyeon"', "가").then(show); show();
})();
</script>
