<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>업스케일</title>
<!--ICON-->
<style>/*CSS*/</style>
</head>
<body>
<header id="bar">
  <span class="brand">업스케일</span>
  <button class="tb" id="bOpen" title="열기 (Ctrl+O)"><i data-i="open"></i><span>열기</span></button>
  <div class="seg" id="scale" title="배율">
    <button data-s="2" class="on">2×</button><button data-s="3">3×</button><button data-s="4">4×</button>
  </div>
  <select id="fmt" title="저장 형식"><option value="keep">원본 형식</option><option value="png">PNG</option><option value="jpg">JPG</option><option value="webp">WEBP</option></select>
  <button class="tb primary" id="bRun" disabled><i data-i="play"></i><span>시작</span></button>
  <button class="tb" id="bStop" hidden><i data-i="stop"></i><span>중지</span></button>
  <span class="spacer"></span>
  <span id="eng" class="chip" title="실행 장치"></span>
  <button class="tb" id="bSaveAll" disabled title="모두 저장"><i data-i="save"></i><span>모두 저장</span></button>
  <button class="tb ic" id="bClear" disabled title="모두 지우기"><i data-i="trash"></i></button>
  <input type="file" id="file" accept="image/*" multiple hidden>
</header>
<main id="main">
  <div id="empty"><i data-i="image"></i><span>이미지 끌어다 놓기</span></div>
  <div id="list"></div>
</main>
<div id="viewer" hidden>
  <div id="stageWrap">
    <div id="stage"><img id="vOrig" alt=""><div id="vAi"></div></div>
    <div id="split"><span></span></div>
    <span class="tag l">AI</span><span class="tag r">원본</span>
  </div>
  <div id="vbar">
    <button class="tb ic" id="vPrev" title="이전 (←)"><i data-i="prev"></i></button>
    <span id="vName"></span>
    <button class="tb ic" id="vNext" title="다음 (→)"><i data-i="next"></i></button>
    <span class="spacer"></span>
    <button class="tb" id="vFit" title="화면 맞춤 (0)">맞춤</button>
    <button class="tb" id="v100" title="실제 크기 (1)">100%</button>
    <button class="tb" id="v200" title="200% (2)">200%</button>
    <span id="vZoom"></span>
    <span class="spacer"></span>
    <button class="tb" id="vSave"><i data-i="save"></i><span>저장</span></button>
    <button class="tb ic" id="vClose" title="닫기 (Esc)"><i data-i="close"></i></button>
  </div>
</div>
<div id="drop" hidden></div>
<div id="toast"></div>
<script type="text/plain" id="ort-src">/*ORT*/</script>
<script type="text/plain" id="worker-src">/*WORKER*/</script>
<script type="text/plain" id="z-wasm">/*WASM*/</script>
<script type="text/plain" id="z-model">/*MODEL*/</script>
<script>/*APP*/</script>
</body>
</html>
