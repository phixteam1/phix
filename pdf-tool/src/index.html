<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 정리함</title>
<!--ICON-->
<style>
/*CSS*/
</style>
</head>
<body>
<header id="bar">
  <div class="brand">PDF 정리함</div>
  <div class="modes"><button data-mode="pdf" class="on">PDF 편집</button><button data-mode="img">이미지 편집</button></div>
  <div class="group">
    <button id="bOpen" class="tb primary" title="파일 열기 (Ctrl+O)"><i data-i="open"></i><span>열기</span></button>
    <div class="dd">
      <button class="tb" data-dd="ddInsert" title="삽입"><i data-i="insert"></i><span>삽입</span><i data-i="caret" class="caret"></i></button>
      <div class="menu" id="ddInsert">
        <button id="mInsFile">PDF·이미지 파일 삽입…</button>
        <button id="mInsBlank">빈 페이지 삽입</button>
        <button id="mInsDup">선택 페이지 복제 <kbd>Ctrl+D</kbd></button>
      </div>
    </div>
  </div>
  <div class="group">
    <button id="bUndo" class="tb ic" title="되돌리기 (Ctrl+Z)"><i data-i="undo"></i></button>
    <button id="bRedo" class="tb ic" title="다시 실행 (Ctrl+Y)"><i data-i="redo"></i></button>
  </div>
  <div class="group">
    <button id="bRotL" class="tb" title="왼쪽으로 90° (L)"><i data-i="rotl"></i><span>왼쪽</span></button>
    <button id="bRotR" class="tb" title="오른쪽으로 90° (R)"><i data-i="rotr"></i><span>오른쪽</span></button>
    <button id="bDel" class="tb" title="선택 페이지 삭제 (Delete)"><i data-i="trash"></i><span>삭제</span></button>
  </div>
  <div class="group">
    <button id="bExtract" class="tb" title="선택 페이지만 새 PDF로 저장"><i data-i="extract"></i><span>추출</span></button>
    <button id="bSplit" class="tb" title="여러 파일로 나누기"><i data-i="split"></i><span>분할</span></button>
    <button id="bImg" class="tb" title="페이지를 JPG·PNG 이미지로 저장"><i data-i="image"></i><span>이미지로</span></button>
    <button id="bComp" class="tb" title="PDF 용량 줄이기"><i data-i="compress"></i><span>용량</span></button>
  </div>
  <div class="group">
    <button id="bNum" class="tb" title="페이지 번호 넣기"><i data-i="num"></i><span>쪽번호</span></button>
    <button id="bWm" class="tb" title="워터마크 넣기"><i data-i="wm"></i><span>워터마크</span></button>
    <button id="bFit" class="tb" title="페이지 크기 맞추기"><i data-i="size"></i><span>크기</span></button>
  </div>
  <div class="igroup">
    <button id="iAdd" class="tb primary" title="이미지 추가 (Ctrl+O)"><i data-i="open"></i><span>추가</span></button>
  </div>
  <div class="igroup">
    <button id="iUndo" class="tb ic" title="되돌리기 (Ctrl+Z)"><i data-i="undo"></i></button>
    <button id="iRedo" class="tb ic" title="다시 실행 (Ctrl+Y)"><i data-i="redo"></i></button>
  </div>
  <div class="igroup">
    <button id="iRotL" class="tb" title="왼쪽으로 90° (L)"><i data-i="rotl"></i><span>왼쪽</span></button>
    <button id="iRotR" class="tb" title="오른쪽으로 90° (R)"><i data-i="rotr"></i><span>오른쪽</span></button>
    <button id="iFlipH" class="tb ic" title="좌우 뒤집기"><i data-i="fliph"></i></button>
    <button id="iFlipV" class="tb ic" title="상하 뒤집기"><i data-i="flipv"></i></button>
    <button id="iDel" class="tb" title="목록에서 빼기 (Delete)"><i data-i="trash"></i><span>빼기</span></button>
  </div>
  <div class="igroup">
    <button id="iEdit" class="tb" title="그림판으로 편집 (Enter)"><i data-i="pen"></i><span>편집</span></button>
    <button id="iResize" class="tb" title="크기 바꾸기"><i data-i="size"></i><span>크기</span></button>
    <button id="iJoin" class="tb" title="여러 장을 한 장으로 이어 붙이기"><i data-i="join"></i><span>이어 붙이기</span></button>
    <button id="iText" class="tb" title="글자·워터마크 넣기"><i data-i="text"></i><span>글자</span></button>
  </div>
  <div class="igroup">
    <button id="iRename" class="tb" title="이름 한꺼번에 바꾸기"><i data-i="rename"></i><span>이름</span></button>
    <button id="iPdf" class="tb" title="PDF로 만들기 (PDF 편집 탭으로 보냄)"><i data-i="extract"></i><span>PDF로</span></button>
  </div>
  <div class="spacer"></div>
  <div class="group save">
    <input id="fname" type="text" placeholder="저장할 파일 이름" spellcheck="false">
    <span class="ext">.pdf</span>
    <button id="bSave" class="tb primary" title="저장 (Ctrl+S)"><i data-i="save"></i><span>저장</span></button>
    <button id="bTab" class="tb ic" title="새 탭에서 열기 (인쇄용)"><i data-i="print"></i></button>
  </div>
</header>

<div id="sub">
  <div class="selbox">
    <span>선택</span>
    <input id="selInput" type="text" placeholder="예: 1-3, 7" title="쪽 범위를 입력하고 Enter" spellcheck="false">
    <button class="chip" id="sAll">전체</button>
    <button class="chip" id="sOdd">홀수</button>
    <button class="chip" id="sEven">짝수</button>
    <button class="chip" id="sInv">반전</button>
    <button class="chip" id="sNone">해제</button>
    <button class="chip" id="sRev" title="선택한 페이지(없으면 전체)의 순서를 거꾸로">순서 뒤집기</button>
  </div>
  <div class="spacer"></div>
  <div id="badges"></div>
  <label class="zoom" title="썸네일 크기"><i data-i="zoomout"></i><input id="zoom" type="range" min="90" max="340" step="10" value="180"><i data-i="zoomin"></i></label>
</div>

<main id="main">
  <aside id="side">
    <div class="side-h">열린 파일</div>
    <div id="srcList"></div>
  </aside>
  <section id="gridWrap">
    <div id="empty">
      <div class="drop">
        <div class="big"><i data-i="open"></i></div>
        <div class="t1">PDF를 여기로 끌어다 놓기</div>
        <button id="bOpen2" class="tb primary">파일 열기</button>
      </div>
    </div>
    <div id="grid"></div>
    <div id="marker"></div>
  </section>
</main>

<main id="imgMain" hidden>
  <aside class="iside">
    <div class="side-h">저장</div>
    <div class="ifield"><label>크기</label><select id="mPx">
      <option value="0" selected>원본 크기</option><option value="3000">긴 변 3000px</option><option value="2000">긴 변 2000px</option><option value="1280">긴 변 1280px</option><option value="800">긴 변 800px</option></select></div>
    <div class="ifield"><label>화질 <span id="mQV">100%</span></label><input type="range" id="mQ" min="40" max="100" step="5" value="100"></div>
    <div class="ifield"><label>형식</label><select id="mFmt"><option value="keep" selected>원본 형식</option><option value="jpg">JPG</option><option value="png">PNG</option><option value="webp">WebP</option></select></div>
    <div class="icsum" id="icSum">이미지를 올려줘</div>
    <button id="icSave" class="tb primary big" disabled><i data-i="save"></i><span>저장</span></button>
  </aside>
  <section id="icWrap">
    <div id="isub">
      <button class="chip" id="iAll">전체 선택</button><button class="chip" id="iNone">선택 해제</button>
      <span id="iInfo" class="muted"></span>
    </div>
    <div id="icEmpty"><div class="drop"><div class="big"><i data-i="image"></i></div><div class="t1">이미지를 여기로 끌어다 놓기</div><button id="icAdd2" class="tb primary">이미지 추가</button></div></div>
    <div id="icList"></div>
  </section>
</main>

<div id="editor" class="viewer" hidden>
  <div class="v-bar ebar">
    <div class="etools" id="eTools">
      <button class="tb ic" data-tool="pen" title="펜 (P)"><i data-i="pen"></i></button>
      <button class="tb ic" data-tool="hl" title="형광펜 (H)"><i data-i="hl"></i></button>
      <button class="tb ic" data-tool="line" title="직선"><i data-i="line"></i></button>
      <button class="tb ic" data-tool="arrow" title="화살표 (A)"><i data-i="arrow"></i></button>
      <button class="tb ic" data-tool="rect" title="네모 (B)"><i data-i="rect"></i></button>
      <button class="tb ic" data-tool="ellipse" title="동그라미 (O)"><i data-i="ellipse"></i></button>
      <button class="tb ic" data-tool="text" title="글자 (T)"><i data-i="text"></i></button>
      <button class="tb ic" data-tool="mosaic" title="모자이크 (M)"><i data-i="mosaic"></i></button>
      <button class="tb ic" data-tool="cover" title="가리기 (칠한 네모)"><i data-i="cover"></i></button>
      <button class="tb ic" data-tool="eraser" title="지우개: 그린 것만 지워 (E)"><i data-i="eraser"></i></button>
      <button class="tb ic" data-tool="crop" title="자르기 (C)"><i data-i="crop"></i></button>
    </div>
    <span class="sep"></span>
    <div class="eopts">
      <span class="swatches" id="eSw"></span>
      <input type="color" id="eColor" value="#e53935" title="색 고르기">
      <label class="eo" id="oWidth" title="굵기"><span>굵기</span><input type="range" id="eWidth" min="1" max="40" value="4"><b id="eWidthV">4</b></label>
      <label class="eo" id="oFont"><span>글자</span><select id="eFont"><option value="16">작게</option><option value="24" selected>보통</option><option value="36">크게</option><option value="56">아주 크게</option></select></label>
      <label class="eo" id="oFill"><input type="checkbox" id="eFill"> 채우기</label>
      <label class="eo" id="oRatio"><span>비율</span><select id="eRatio"><option value="0">자유</option><option value="1">1:1</option><option value="1.3333">4:3</option><option value="0.75">3:4</option><option value="1.7778">16:9</option><option value="0.7071">A4 세로</option><option value="1.4142">A4 가로</option></select></label>
      <button class="tb primary" id="eCropApply" hidden>자르기 적용</button>
    </div>
    <span class="spacer"></span>
    <button class="tb ic" id="eUndo" title="되돌리기 (Ctrl+Z)"><i data-i="undo"></i></button>
    <button class="tb ic" id="eRedo" title="다시 (Ctrl+Y)"><i data-i="redo"></i></button>
    <button class="tb ic" id="eRotL" title="왼쪽 회전"><i data-i="rotl"></i></button>
    <button class="tb ic" id="eRotR" title="오른쪽 회전"><i data-i="rotr"></i></button>
    <button class="tb ic" id="eFlip" title="좌우 뒤집기"><i data-i="fliph"></i></button>
    <span class="sep"></span>
    <button class="tb ic" id="eOut" title="축소"><i data-i="zoomout"></i></button>
    <span id="eZoom">100%</span>
    <button class="tb ic" id="eIn" title="확대"><i data-i="zoomin"></i></button>
    <button class="tb" id="eFit">맞춤</button>
    <span class="sep"></span>
    <button class="tb" id="eCancel">취소</button>
    <button class="tb primary" id="eDone">완료</button>
  </div>
  <div class="v-body" id="eBody"><div id="eStage"><canvas id="eCanvas"></canvas><canvas id="eOver"></canvas></div></div>
</div>

<footer id="status"><span id="stTotal"></span><span id="stSel"></span><span class="spacer"></span><span id="stMsg"></span></footer>

<input id="fileIn" type="file" multiple accept="application/pdf,.pdf,image/*" hidden>
<input id="fileImgC" type="file" multiple accept="image/*" hidden>
<input id="fileIns" type="file" multiple accept="application/pdf,.pdf,image/*" hidden>

<div id="modal" class="modal" hidden><div class="dlg"><div class="dlg-h"><span id="dlgTitle"></span><button class="x" data-close>×</button></div><div class="dlg-b" id="dlgBody"></div><div class="dlg-f" id="dlgFoot"></div></div></div>

<div id="viewer" class="viewer" hidden>
  <div class="v-bar">
    <button class="tb ic" id="vPrev" title="이전 (←)"><i data-i="left"></i></button>
    <span id="vInfo"></span>
    <button class="tb ic" id="vNext" title="다음 (→)"><i data-i="right"></i></button>
    <span class="sep"></span>
    <button class="tb ic" id="vOut" title="축소 (-)"><i data-i="zoomout"></i></button>
    <span id="vZoom">100%</span>
    <button class="tb ic" id="vIn" title="확대 (+)"><i data-i="zoomin"></i></button>
    <button class="tb" id="vFit" title="화면에 맞추기 (0)">맞춤</button>
    <span class="sep"></span>
    <button class="tb ic" id="vRotL" title="왼쪽 회전"><i data-i="rotl"></i></button>
    <button class="tb ic" id="vRotR" title="오른쪽 회전"><i data-i="rotr"></i></button>
    <button class="tb ic" id="vDel" title="이 페이지 삭제"><i data-i="trash"></i></button>
    <span class="spacer"></span>
    <button class="tb ic" id="vClose" title="닫기 (Esc)"><i data-i="close"></i></button>
  </div>
  <div class="v-body" id="vBody"><canvas id="vCanvas"></canvas></div>
</div>

<div id="busy" hidden><div class="bx"><div class="spin"></div><div id="busyMsg">처리 중…</div></div></div>
<div id="toast"></div>

<script type="text/plain" id="pdfjs-worker">/*PDFJS_WORKER*/</script>
<script type="text/plain" id="cmaps">/*CMAPS*/</script>
<script>/*PDFJS*/</script>
<script>/*PDFLIB*/</script>
<script>
/*APP*/
</script>
</body>
</html>
