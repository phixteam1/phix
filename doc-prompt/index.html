<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style>
<title>다큐 조립대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#18202E; --muted:#5B6576;
  --line:#D3DAE4; --accent:#5A3FC8; --accent-ink:#FFFFFF; --accent-soft:#E6E0FB;
  --ok:#1F7A4D; --warn:#A45A00; --shadow:0 1px 2px rgba(24,32,46,.06),0 6px 20px rgba(24,32,46,.06);
  --serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10141B; --surface:#181E28; --sunk:#222A36; --ink:#E4E8F0; --muted:#95A0B2;
    --line:#2C3544; --accent:#AE9BFF; --accent-ink:#150F2E; --accent-soft:#2E2658;
    --ok:#5FCB94; --warn:#F0A94B; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10141B; --surface:#181E28; --sunk:#222A36; --ink:#E4E8F0; --muted:#95A0B2;
  --line:#2C3544; --accent:#AE9BFF; --accent-ink:#150F2E; --accent-soft:#2E2658;
  --ok:#5FCB94; --warn:#F0A94B; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding:0 16px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{padding-block:28px 4px;display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:60ch}
h2{font-family:var(--serif);font-size:19px;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],textarea,select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:72px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}

/* 위치 */
.timeline{position:relative;padding-top:4px}
.stages{display:grid;grid-template-columns:10fr 20fr 20fr 15fr 15fr 13fr 7fr;font-size:11px;color:var(--muted);gap:2px;margin-bottom:6px}
.stages span{border-top:3px solid var(--line);padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stages span.on{border-top-color:var(--accent);color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.posread{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.posread b{font-family:var(--serif);font-size:26px;font-variant-numeric:tabular-nums}
.posread .stage-name{font-weight:600;color:var(--accent)}
.stage-hint{font-size:13px;color:var(--muted);margin:0;background:var(--sunk);border-radius:8px;padding:8px 10px}

/* 검색바 */
.finder{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;gap:8px;align-items:center}
.finder input{background:var(--surface)}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink)}

/* 카테고리 */
.cats{display:flex;flex-direction:column;gap:8px}
details.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.cat>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px}
details.cat>summary::-webkit-details-marker{display:none}
.cat-name{font-family:var(--serif);font-weight:700;font-size:17px}
.cat-sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-count{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 9px}
.cat-count.has{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-left:2px;flex:none}
details[open]>summary .chev{transform:rotate(225deg)}
.cat-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.grp h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.custom{border-style:dashed}
.add-row{display:flex;gap:8px}
.add-row input{font-size:14px;padding:8px 10px}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}

/* 선택한 요소 */
.count-pill{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.count-pill.good{color:var(--ok)}
.count-pill.many{color:var(--warn)}
.picked{display:flex;flex-direction:column}
.pick{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line)}
.pick:first-child{border-top:0;padding-top:0}
.pick-name{font-weight:600}
.pick-name small{font-weight:400;color:var(--muted);margin-right:6px}
.pick-level{grid-column:1/-1;display:grid;grid-template-columns:1fr 9.5em;gap:10px;align-items:center}
.pick-level output{font-size:12.5px;color:var(--muted);text-align:right}
.pick-level output b{color:var(--ink);font-variant-numeric:tabular-nums}
.pick input[type=text]{grid-column:1/-1;font-size:13.5px;padding:7px 10px;background:var(--bg)}
.x{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px}
.x:hover{color:var(--ink)}
.legend{font-size:12.5px;color:var(--muted);margin:0}
.rule-note{grid-column:1/-1;font-size:12.5px;color:var(--muted)}

/* 결과 */
pre.out{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--sans);font-size:13.5px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:420px;overflow:auto}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;accent-color:var(--accent)}

/* 하단 바 */
.tip{font-size:13px;color:var(--muted);margin:0}
.tip b{color:var(--ink);font-variant-numeric:tabular-nums}
.finder select{width:auto;flex:none;background:var(--surface);padding:10px 8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13.5px;z-index:20;pointer-events:none}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.tab{flex:1;font:inherit;font-size:15px;font-weight:600;border:0;border-radius:9px;padding:10px 12px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
body[data-mode="short"] .serial-only,body[data-mode="serial"] .short-only{display:none!important}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head><body>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">과학 다큐 프롬프트 생성기</span>
    <h1>다큐 조립대</h1>
    <p class="lede">주제와 기법을 고르면, 애니메이션 과학 영상의 장면별 대본을 받아낼 프롬프트가 만들어져요. 결과는 영상 코딩에 바로 쓸 수 있게 장면 단위로 나와요.</p>
  </header>

  <section class="panel" aria-labelledby="h-work">
    <div class="panel-head"><h2 id="h-work">영상</h2></div>
    <label class="f" for="f-title">주제나 질문
      <input type="text" id="f-title" placeholder="예: 만약 지구에 달이 없었다면?">
    </label>
    <div class="row2">
      <label class="f" for="f-len">영상 길이
        <select id="f-len">
          <option value="">정하지 않음</option>
          <option value="3">약 3분</option>
          <option value="5">약 5분</option>
          <option value="8">약 8분</option>
          <option value="12">약 12분</option>
        </select>
      </label>
      <label class="f" for="f-fmt">결과 형식
        <select id="f-fmt">
          <option value="json">JSON (영상 코딩용)</option>
          <option value="table">장면표 (사람이 읽기용)</option>
          <option value="script">내레이션 대본만</option>
        </select>
      </label>
    </div>
    <label class="f" for="f-msg">시청자가 기억할 한 문장 (선택)
      <input type="text" id="f-msg" placeholder="예: 달은 지구의 자전축을 붙잡아 계절을 지켜준다">
    </label>
    <label class="f" for="f-must">꼭 다룰 내용 (선택)
      <textarea id="f-must" placeholder="예: 조석 고정, 하루 길이가 길어지는 원리, 달이 없을 때의 기후 변화"></textarea>
    </label>
  </section>

  <div>
    <div class="finder">
      <input type="text" id="f-search" placeholder="요소 검색 (예: 비유, 블랙홀, 줌)" aria-label="요소 검색" autocomplete="off">
      <select id="f-rn" aria-label="무작위로 고를 개수"></select>
      <button class="btn" id="b-random" type="button">무작위</button>
    </div>
    <div class="cats" id="cats"></div>
  </div>

  <section class="panel" aria-labelledby="h-picked">
    <div class="panel-head">
      <h2 id="h-picked">고른 요소</h2>
      <span class="count-pill" id="count-pill">0개</span>
    </div>
    <p class="legend">강도는 영상 전체에서 그 요소가 얼마나 큰 역할을 하느냐예요. 4~5는 영상의 뼈대, 2~3은 곳곳에 섞이는 양념, 1은 한두 번 쓰는 정도예요. 말투, 시청자, 정확성 같은 요소는 강도 없이 규칙으로 들어가요.</p>
    <div class="picked" id="picked"></div>
    <div><button class="btn ghost" id="b-clear" type="button">모두 비우기</button></div>
  </section>

  <section class="panel" aria-labelledby="h-out" id="out-panel">
    <div class="panel-head">
      <h2 id="h-out">완성된 프롬프트</h2>
      <button class="btn primary" id="b-copy" type="button">복사</button>
    </div>
    <p class="tip" id="tip"></p>
    <pre class="out" id="out" tabindex="0"></pre>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// 요소 데이터: [분류 id, 이름, 설명, [[소분류, "요소|요소~설명|..."]]]
const DATA = [
 ["field","분야","무엇에 관한 영상인가",[
  ["물리","고전역학|상대성 이론|양자역학|열역학과 엔트로피|전자기|입자물리|빛과 파동|소리와 진동|중력"],
  ["우주","태양계|별의 일생|블랙홀|은하|우주론과 빅뱅|우주의 종말|외계 생명|행성 탐사|우주 거리와 크기|암흑물질과 암흑에너지"],
  ["생명","진화|유전자와 DNA|세포|미생물과 바이러스|면역계|뇌와 신경|수면|노화|생태계|멸종|인체의 한계|동물의 감각"],
  ["지구","지구의 역사|판 구조와 지진|화산|기후와 기후변화|바다|대기와 날씨|물의 순환|대멸종"],
  ["화학과 물질","원소와 주기율표|원자의 구조|화학 결합|물질의 상태|방사능|탄소와 생명의 화학|신소재"],
  ["수학과 정보","무한|확률과 통계|지수적 증가|암호|컴퓨터와 알고리즘|인공지능|게임 이론|복잡계와 카오스"],
  ["기술과 미래","에너지와 발전|핵분열과 핵융합|우주 개발|유전자 편집|나노기술|로봇|인류의 미래|테라포밍"],
  ["인간과 몸","질병과 의학|약과 백신|영양과 음식|중독의 과학|감정의 과학|기억의 과학|인구와 인류사"]
 ]],
 ["angle","접근 방식","어떤 질문으로 파고드나",[
  ["질문 틀","만약 ~라면?~가정을 세우고 결과를 따라감|왜 ~일까?|얼마나 크고 작을까?|~은 어떻게 작동할까?|~은 언제 끝날까?|우리가 틀렸던 것|최악의 시나리오|아무도 답을 모르는 질문"],
  ["관점","한 사물의 일생~탄생부터 끝까지 따라감|몸 속 여행|우주 크기 여행~작은 것에서 큰 것으로|시간 여행~과거에서 미래로|사고 실험|두 입장의 대결|숫자로 보는 주제|일상 속 과학"]
 ]],
 ["explain","설명 기법","어려운 걸 어떻게 쉽게 만드나",[
  ["비유와 스케일","일상 사물 비유|스케일 축소~지구를 사과만 하게 줄이는 식|인간 척도로 환산~숫자를 몸으로 느끼게|의인화~세포나 입자를 캐릭터처럼|같은 비유 재사용~한 비유를 끝까지 끌고 감"],
  ["단계 설계","쉬운 버전부터 정확한 버전으로~처음엔 단순화, 뒤에서 바로잡음|흔한 오해 먼저 뒤집기|용어는 쓰고 바로 풀기|한 번에 개념 하나|규칙을 보여주고 결과를 추론하게|반례로 확인"],
  ["근거 보여주기","역사 속 실험 재현|과학자의 발견 과정|그래프 하나로 요약|실제 수치 비교|관측 증거 제시"]

 ["structure","구성","영상을 어떻게 짜나",[

  ["유머 방식","자기 비하 유머|과장된 결과로 웃기기|의인화 캐릭터의 반응|건조한 한 마디|뜻밖의 비교"]
 ]],
 ["voice","내레이션","어떻게 말하나",[
  ["말투","존댓말 내레이션|반말 내레이션|친구처럼 편한 말투|다큐 성우 말투"],
  ["화법","짧은 문장|시청자를 당신으로 부르기|우리라는 표현~인류 전체를 우리로|질문을 던지고 답하기|극적인 멈춤|숫자는 반올림해서 기억하기 쉽게|반복되는 문장으로 리듬"]
 ]],
 ["visual","화면 연출","영상에서 어떻게 보이나",[
  ["그림체","플랫 벡터 일러스트|단순한 기하 도형|밝은 색과 어두운 배경|둥근 캐릭터|손그림 느낌|미니멀 흑백"],
  ["화면 기법","줌 인과 줌 아웃|분할 화면 비교|스케일 바|타임라인 바|단면도|라벨과 화살표|숫자 카운터 애니메이션|입자 시뮬레이션|지구본과 지도|그래프가 그려지는 애니메이션|화면 텍스트 강조"],
  ["캐릭터","반복 등장 마스코트|의인화한 세포나 입자|단순한 사람 실루엣|동물 캐릭터"],
  ["움직임","부드러운 전환|장면마다 한 가지 움직임|천천히 흐르는 배경|빠른 몽타주"]
 ]],
 ["audience","시청자","누가 보나",[
  ["대상","초등학생|청소년|일반 성인|과학 애호가|전공자"]
 ]],
 ["rigor","정확성","얼마나 엄밀하게",[
  ["원칙","추정치는 범위로 말하기|불확실한 건 불확실하다고 말하기|단순화했다고 밝히기|과장 금지|출처 기관이나 연구 언급|논쟁 중인 주제는 양쪽 소개|흔한 오해 바로잡기"]
 ]]
];

const LV = [
 ["숨김","직접 말하지 않고 배경으로만 깔림"],
 ["한두 번","한두 장면에서만 쓰임"],
 ["가끔","자연스러운 곳에서 가끔 쓰임"],
 ["분명히","시청자가 분명히 알아챌 만큼 쓰임"],
 ["주요","여러 장면을 이끄는 주요 도구"],
 ["뼈대","영상 전체를 이끄는 뼈대"]];
// 강도 대신 규칙으로 다루는 분류
const RULE_CATS = new Set(["voice","audience","rigor"]);
const RULE_GROUPS = new Set(["흐름","도입","마무리","그림체"]);
// 한국어 내레이션은 1분에 약 300자
const CHARS_PER_MIN = 300;

const CATS = DATA.map(([id,name,sub,groups]) => ({
  id,name,sub,
  groups: groups.map(([g,s]) => ({name:g, items: s.split("|").map(t => {
    const [n,d] = t.split("~"); return {id:id+":"+n, name:n, desc:d||"", cat:id, rule:RULE_CATS.has(id)||RULE_GROUPS.has(g)};
  })}))
}));
const ITEM = {};
CATS.forEach(c => c.groups.forEach(g => g.items.forEach(it => ITEM[it.id] = it)));
const CATNAME = Object.fromEntries(CATS.map(c => [c.id,c.name]));

const KEY = "docu-jorip-v1";
const EMPTY = {title:"", len:"", fmt:"json", msg:"", must:"", custom:{}, sel:{}};
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!S || !S.sel) S = structuredClone(EMPTY);
S.custom = S.custom || {};
Object.entries(S.custom).forEach(([cid,names]) => names.forEach(n => addCustomItem(cid,n)));
Object.keys(S.sel).forEach(id => { if (!ITEM[id]) delete S.sel[id]; });
const openCats = new Set();

function addCustomItem(cid, n){
  const id = cid+":"+n;
  if (!ITEM[id]) ITEM[id] = {id,name:n,desc:"",cat:cid,custom:true,rule:RULE_CATS.has(cid)};
  return id;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderCats(){
  const q = $("#f-search").value.trim().toLowerCase();
  const box = $("#cats"); box.innerHTML = "";
  let any = false;
  CATS.forEach(c => {
    const groups = c.groups.map(g => ({name:g.name, items:g.items.filter(it => !q || (it.name+" "+it.desc+" "+g.name).toLowerCase().includes(q))}));
    const customs = (S.custom[c.id]||[]).map(n => ITEM[c.id+":"+n]).filter(it => it && (!q || it.name.toLowerCase().includes(q)));
    if (customs.length) groups.push({name:"직접 추가한 요소", items:customs});
    const shown = groups.filter(g => g.items.length);
    if (q && !shown.length) return;
    any = true;
    const total = c.groups.reduce((a,g) => a+g.items.length, 0) + (S.custom[c.id]||[]).length;
    const nSel = Object.keys(S.sel).filter(k => k.startsWith(c.id+":")).length;
    const d = document.createElement("details");
    d.className = "cat"; d.dataset.cat = c.id;
    if (q || openCats.has(c.id)) d.open = true;
    d.innerHTML = `<summary><span class="cat-name">${c.name}</span><span class="cat-sub">${c.sub} · ${total}개</span><span class="cat-count ${nSel?"has":""}">${nSel}</span><span class="chev" aria-hidden="true"></span></summary>
      <div class="cat-body">${shown.map(g => `<div class="grp"><h3>${esc(g.name)}</h3><div class="chips">${g.items.map(it =>
        `<button type="button" class="chip${it.custom?" custom":""}" data-id="${esc(it.id)}" aria-pressed="${!!S.sel[it.id]}"${it.desc?` title="${esc(it.desc)}"`:""}>${esc(it.name)}</button>`).join("")}</div></div>`).join("")}
      ${q ? "" : `<div class="add-row"><input type="text" id="add-${c.id}" placeholder="${c.name}에 직접 추가" aria-label="${c.name}에 요소 직접 추가"><button class="btn" type="button" data-add="${c.id}">추가</button></div>`}</div>`;
    d.addEventListener("toggle", () => { if (!q) d.open ? openCats.add(c.id) : openCats.delete(c.id); });
    box.appendChild(d);
  });
  if (!any) box.innerHTML = `<p class="empty">"${esc(q)}"에 맞는 요소가 없어요. 원하는 분류를 펼쳐서 직접 추가할 수 있어요.</p>`;
}

function renderPicked(){
  const ids = Object.keys(S.sel);
  $("#picked").innerHTML = ids.length ? ids.map(id => {
    const it = ITEM[id]; if (!it) return "";
    const v = S.sel[id];
    return `<div class="pick" data-id="${esc(id)}">
      <div class="pick-name"><small>${CATNAME[it.cat]}</small>${esc(it.name)}</div>
      <button class="x" type="button" data-remove="${esc(id)}" aria-label="${esc(it.name)} 빼기">빼기</button>
      ${it.rule ? `<div class="rule-note">규칙이라 강도 없이 그대로 지켜요</div>` : `<div class="pick-level"><input type="range" min="0" max="5" step="1" value="${v.lv}" data-lv="${esc(id)}" aria-label="${esc(it.name)} 강도"><output><b>${v.lv}</b> ${LV[v.lv][0]}</output></div>`}
      <input type="text" value="${esc(v.note||"")}" data-note="${esc(id)}" placeholder="메모 (선택): 구체적인 비유, 캐릭터 이름 등" aria-label="${esc(it.name)} 메모">
    </div>`;
  }).join("") : `<p class="empty">아직 고른 요소가 없어요. 위에서 골라주세요.</p>`;
  const n = ids.length, pill = $("#count-pill");
  pill.textContent = n + "개" + (n > 15 ? " · 많아요" : n >= 5 ? " · 적당해요" : "");
  pill.className = "count-pill " + (n > 15 ? "many" : n >= 5 ? "good" : "");
}

const FORMATS = {
  json: [
    "결과는 JSON 하나로만 출력해줘. 코드 블록 안에 넣고, 앞뒤에 다른 말은 쓰지 마.",
    "형식:",
    "{",
    '  "title": "영상 제목",',
    '  "palette": ["#색상코드", "..."],',
    '  "characters": [{"id": "영문 id", "look": "생김새를 도형과 색으로 설명"}],',
    '  "scenes": [',
    "    {",
    '      "id": 1,',
    '      "duration_sec": 8,',
    '      "narration": "이 장면의 내레이션",',
    '      "on_screen_text": "화면에 뜨는 짧은 글자, 없으면 빈 문자열",',
    '      "visual": "무엇이 보이는지. 도형, 색, 위치로 구체적으로",',
    '      "animation": "무엇이 어떻게 움직이는지. 시작 상태, 끝 상태, 타이밍",',
    '      "transition": "다음 장면으로 넘어가는 방식"',
    "    }",
    "  ]",
    "}",
    "- visual과 animation은 코드로 그릴 수 있게 써줘. 원, 사각형, 선, 텍스트, 색상코드, 화면 위치(왼쪽 위, 가운데 등), 크기 비율로 설명하고, 사진이나 실사 영상이 필요한 연출은 피해줘.",
    "- 장면 하나는 5~12초, 한 장면에 움직임은 한두 개만.",
    "- 같은 캐릭터와 색은 모든 장면에서 같은 id와 색상코드로 불러줘."
  ],
  table: [
    "결과는 장면표로 써줘. 장면마다 번호, 길이(초), 내레이션, 화면 글자, 화면 연출, 움직임을 적어줘.",
    "- 화면 연출은 도형, 색, 위치로 구체적으로. 장면 하나는 5~12초."
  ],
  script: [
    "결과는 내레이션 대본만 써줘. 장면이 바뀌는 곳에만 [장면 전환] 표시를 넣어줘."
  ]
};

function buildPrompt(){
  const ids = Object.keys(S.sel).filter(id => ITEM[id]);
  const L = [];
  L.push("너는 애니메이션 과학 해설 영상(예: 쿠르츠게작트 같은 채널)의 대본 작가이자 연출가야. 아래 설정으로 한 편의 영상 대본을 써줘.", "");
  L.push("[주제]", S.title.trim() || "(아래 요소에 맞는 과학 주제를 네가 하나 골라줘. 흔한 주제보다 궁금증을 부르는 질문 하나로.)", "");
  if (S.msg.trim()) L.push("[시청자가 기억할 한 문장]", S.msg.trim(), "");
  if (S.must.trim()) L.push("[꼭 다룰 내용]", S.must.trim(), "");
  if (S.len){
    const m = +S.len;
    L.push("[길이]", `약 ${m}분. 내레이션은 1분에 약 ${CHARS_PER_MIN}자 기준으로 전체 약 ${(m*CHARS_PER_MIN).toLocaleString()}자, 장면은 약 ${Math.round(m*60/8)}개 안팎.`, "");
  }
  const tagged = ids.filter(id => !ITEM[id].rule);
  const rules = ids.filter(id => ITEM[id].rule);
  const line = id => {
    const it = ITEM[id], v = S.sel[id];
    let t = `- ${it.name} (${CATNAME[it.cat]}${it.desc ? ", "+it.desc : ""})`;
    if (!it.rule) t += `: 강도 ${v.lv}`;
    if ((v.note||"").trim()) t += ` / 메모: ${v.note.trim()}`;
    return t;
  };
  if (tagged.length){
    L.push("[강도의 뜻]", "강도는 영상 전체에서 그 요소가 맡는 역할의 크기야.");
    for (let i = 5; i >= 0; i--) L.push(`${i}: ${LV[i][1]}`);
    L.push("");
    [["[영상의 뼈대]", l => l >= 4], ["[곳곳에 섞을 요소]", l => l === 2 || l === 3], ["[한두 번만 쓸 요소]", l => l === 1], ["[직접 말하지 않을 요소]", l => l === 0]].forEach(([h, f]) => {
      const mine = tagged.filter(id => f(S.sel[id].lv)).sort((x,y) => S.sel[y].lv - S.sel[x].lv);
      if (mine.length) L.push(h, ...mine.map(line), "");
    });
  }
  if (rules.length) L.push("[지킬 규칙]", ...rules.map(line), "");
  L.push("[과학 영상 원칙]");
  L.push("- 사실에 근거해줘. 모르는 수치를 지어내지 말고, 확실하지 않으면 범위나 '대략'으로 말해줘.");
  L.push("- 첫 10초 안에 시청자가 끝까지 보고 싶어질 질문이나 장면을 던져줘.");
  L.push("- 한 장면에는 개념 하나만. 새 개념은 앞 개념 위에 쌓아줘.");
  L.push("- 어려운 개념은 비유나 그림으로 먼저 보여주고 용어는 나중에 붙여줘.");
  L.push("- 내레이션은 귀로 듣는 글이야. 짧게 끊고, 한 문장에 정보 하나만 담아줘.");
  L.push("- 요소를 체크리스트처럼 다 넣으려고 하지 마. 주제를 잘 설명하는 게 먼저야.", "");
  L.push("[결과 형식]", ...FORMATS[S.fmt]);
  return L.join("\n");
}

function renderOut(){
  $("#out").textContent = buildPrompt();
  const n = Object.keys(S.sel).length;
  const core = Object.entries(S.sel).filter(([id,v]) => ITEM[id] && !ITEM[id].rule && v.lv >= 4).length;
  const tip = n>15 ? "15개가 넘으면 일부가 무시될 수 있어요" : core>4 ? `뼈대(강도 4~5)가 ${core}개예요. 2~3개를 추천해요` : n<5 ? "5~15개를 추천해요" : "딱 좋은 구성이에요";
  $("#tip").innerHTML = `<b>${n}개</b> 선택. ${tip}`;
}

function refresh(cats=true){ if (cats) renderCats(); renderPicked(); renderOut(); save(); }

function toggle(id){
  if (S.sel[id]) delete S.sel[id]; else S.sel[id] = {lv:3,note:""};
  document.querySelectorAll(`.chip[data-id="${CSS.escape(id)}"]`).forEach(b => b.setAttribute("aria-pressed", !!S.sel[id]));
  const cnt = document.querySelector(`details[data-cat="${ITEM[id].cat}"] .cat-count`);
  if (cnt){ const n = Object.keys(S.sel).filter(k => k.startsWith(ITEM[id].cat+":")).length; cnt.textContent = n; cnt.classList.toggle("has", n>0); }
  refresh(false);
}

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }
function copy(){
  const text = buildPrompt();
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#out")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("#out-panel").scrollIntoView({behavior:"smooth"}); toast("자동 복사가 막혔어요. 선택된 글을 길게 눌러 복사해주세요"); };
  try { navigator.clipboard.writeText(text).then(() => toast("복사했어요. 챗지피티에 붙여넣으세요"), fallback); } catch(e) { fallback(); }
}

[["#f-title","title"],["#f-len","len","change"],["#f-fmt","fmt","change"],["#f-msg","msg"],["#f-must","must"]].forEach(([q,k,ev="input"]) => {
  const el = $(q); el.value = S[k] ?? "";
  el.addEventListener(ev, () => { S[k] = el.value; renderOut(); save(); });
});
$("#f-search").addEventListener("input", renderCats);
$("#cats").addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if (chip) return toggle(chip.dataset.id);
  const add = e.target.closest("[data-add]");
  if (add){
    const cid = add.dataset.add, inp = $("#add-"+cid), n = inp.value.trim().replace(/[~|]/g,"");
    if (!n) return;
    const id = addCustomItem(cid, n);
    S.custom[cid] = S.custom[cid] || [];
    if (!S.custom[cid].includes(n) && !CATS.find(c=>c.id===cid).groups.some(g=>g.items.some(it=>it.name===n))) S.custom[cid].push(n);
    S.sel[id] = S.sel[id] || {lv:3,note:""};
    openCats.add(cid); refresh(); toast(`'${n}' 추가했어요`);
  }
});
$("#cats").addEventListener("keydown", e => { if (e.key==="Enter" && e.target.id?.startsWith("add-")) { e.preventDefault(); e.target.nextElementSibling.click(); } });
$("#picked").addEventListener("click", e => { const b = e.target.closest("[data-remove]"); if (b) { delete S.sel[b.dataset.remove]; refresh(); } });
$("#picked").addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.lv){ const v = +t.value; S.sel[t.dataset.lv].lv = v; t.nextElementSibling.innerHTML = `<b>${v}</b> ${LV[v][0]}`; }
  if (t.dataset.note !== undefined) S.sel[t.dataset.note].note = t.value;
  renderOut(); save();
});
$("#b-clear").addEventListener("click", () => { S.sel = {}; refresh(); toast("모두 비웠어요"); });
const rnSel = $("#f-rn");
rnSel.innerHTML = Array.from({length:18}, (_,i) => `<option value="${i+3}">${i+3}개</option>`).join("");
rnSel.value = S.rn || 8;
rnSel.addEventListener("change", () => { S.rn = +rnSel.value; save(); });
$("#b-random").addEventListener("click", () => {
  const N = +rnSel.value;
  const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const pools = Object.fromEntries(CATS.map(c => [c.id, shuffle(c.groups.flatMap(g => g.items))]));
  // 분야를 먼저, 나머지 분류를 돌아가며 하나씩
  const order = ["field", ...shuffle(CATS.map(c => c.id).filter(id => id !== "field"))];
  S.sel = {};
  let core = 0, rules = 0, fields = 0, k = 0;
  while (Object.keys(S.sel).length < N && k < 2000){
    const it = pools[order[k++ % order.length]].pop();
    if (!it || S.sel[it.id]) continue;
    if (it.cat === "field"){ if (fields >= 1) continue; fields++; }
    if (it.rule){ if (rules >= 3) continue; rules++; S.sel[it.id] = {lv:3,note:""}; continue; }
    let lv = 1 + Math.floor(Math.random()*5);
    if (lv >= 4 && core >= 2) lv = 1 + Math.floor(Math.random()*3);
    if (lv >= 4) core++;
    S.sel[it.id] = {lv, note:""};
  }
  refresh(); toast(`${Object.keys(S.sel).length}개를 무작위로 골랐어요`);
});
$("#b-copy").addEventListener("click", copy);

refresh();
</script>
</body></html>
